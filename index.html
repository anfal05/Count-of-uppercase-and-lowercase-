
<!DOCTYPE html>
<html>
<head>
    <title>Uppercase and Lowercase Count</title>
</head>
<body>
    <h2>Uppercase and Lowercase Count</h2>

    <input type="text" id="word" placeholder="Enter the word">
    <button onclick="countLetters()">Submit</button>

    <p id="output"></p>

    <script>
        function countLetters() {
            let str = document.getElementById("word").value;
            let upper = 0;
            let lower = 0;

            for (let i = 0; i < str.length; i++) {
                if (str[i] >= 'A' && str[i] <= 'Z') {
                    upper = upper + 1;
                } else if (str[i] >= 'a' && str[i] <= 'z') {
                    lower = lower + 1;
                }
            }

            document.getElementById("output").innerHTML =
                "Uppercase: " + upper + "<br>" +
                "Lowercase: " + lower;
        }
    </script>
</body>
</html>
